# ===================================================================
# SpendFlow - Spring Boot Application Configuration
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=Personal-Expense-Tracker

# MySQL Database Configuration
# Automatically creates the database 'expense_tracker_db' if it does not already exist
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# 'update' automatically updates/creates the database tables based on Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Static Resource Handling (serves HTML, CSS, JS directly from /static)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Authenticated API sessions use an HttpOnly cookie; keep browsers on same-site
# requests by default and rely on TLS termination to configure secure cookies in prod.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
